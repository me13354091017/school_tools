name: Optimize App Icons
on:
  push:
    paths:
      - '.github/workflows/optimize-icons.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ImageMagick
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick > /dev/null

      - name: Compress oversized icons to 128px webp
        run: |
          python3 - << 'PY'
          import re, subprocess, pathlib

          ICONS = pathlib.Path('assets/icons')
          html_path = pathlib.Path('index.html')
          html = html_path.read_text(encoding='utf-8')
          converted, skipped, failed = 0, 0, []

          for src in sorted(ICONS.iterdir()):
              if not src.is_file() or src.name.startswith('_'):
                  continue
              if src.suffix.lower() == '.svg' or src.stat().st_size <= 30000:
                  skipped += 1
                  continue
              dst = src.with_suffix('.webp')
              try:
                  subprocess.run(['convert', str(src), '-resize', '128x128', '-background', 'none',
                                  '-gravity', 'center', '-extent', '128x128', '-strip',
                                  '-quality', '88', str(dst)], check=True, capture_output=True, timeout=90)
                  if dst.exists() and dst.stat().st_size < src.stat().st_size:
                      html = html.replace('assets/icons/' + src.name, 'assets/icons/' + dst.name)
                      converted += 1
                  elif dst.exists():
                      dst.unlink()
              except Exception as e:
                  failed.append(f'{src.name}: {type(e).__name__} {e}'[:150])

          html_path.write_text(html, encoding='utf-8')
          pathlib.Path('assets/icons/_compress.log').write_text(
              f'converted {converted}, skipped {skipped}, failed {len(failed)}\n' + '\n'.join(failed), encoding='utf-8')
          print('converted', converted, 'skipped', skipped, 'failed', len(failed))
          PY

      - name: Prune unreferenced icons
        run: |
          python3 - << 'PY'
          import re, pathlib
          html = pathlib.Path('index.html').read_text(encoding='utf-8')
          refs = set(re.findall(r'assets/icons/([^"\'\)]+)', html))
          ICONS = pathlib.Path('assets/icons')
          removed = 0
          for f in ICONS.iterdir():
              if not f.is_file() or f.name.startswith('_'):
                  continue
              if f.name not in refs:
                  f.unlink()
                  removed += 1
          print('pruned', removed)
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html assets/icons
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "perf: 大图标转为 128px webp"
          git push
