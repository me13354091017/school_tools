name: STB announce 1.0.1.49

on:
  push:
    paths:
      - 'release-notes/stb-1.0.1.49.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert announcement on top
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if '1.0.1.49' in s:
              print('already announced')
              raise SystemExit(0)
          anchor = '<ul class="announcement-list">'
          block = '''<li class="announcement-item">
            <time datetime="2026-11-22">2026-11-22</time>
            <p class="announcement-content">SchoolToolsBoard（STB）更新 1.0.1.49：修好 WPS 轻量批注「结束放映」——真机定位出 Qt 放映窗会丢弃纯 Esc；本版先向放映窗投递一次鼠标点击消息再发 Esc，实测连续 4 次都能立即关窗回到白板；并实测白板书写、板中板开关、插入函数（y=x 出图并可插入）、设置 7 个页签、清屏、计时器、抽奖均正常。下载：安装包 / 免安装桌面版（GitHub Release v1.0.1.49）。</p>
        </li>'''
          new = anchor + '\n        ' + block
          if anchor not in s:
              raise SystemExit('anchor not found')
          s = s.replace(anchor, new, 1)
          p.write_text(s, encoding='utf-8')
          print('inserted')
          PY
      - name: Commit and push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git commit -m "announce: STB 1.0.1.49" || exit 0
          git push
