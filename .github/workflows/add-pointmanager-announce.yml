name: Add PointManager Announcement
on:
  push:
    paths:
      - '.github/workflows/add-pointmanager-announce.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Insert PointManager announcement
        run: |
          python3 - << 'PY'
          from pathlib import Path
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          guard = 'PointManager（学生积分管理）发布 1.0.0.0'
          if guard in html:
              print('SKIP: announcement already present')
              raise SystemExit(0)
          marker = '<ul class="announcement-list">'
          if html.count(marker) != 1:
              raise SystemExit('marker count unexpected: %d' % html.count(marker))
          entry = (
              '        <li class="announcement-item">\n'
              '            <time datetime="2026-11-11">2026-11-11</time>\n'
              '            <p class="announcement-content">PointManager（学生积分管理）发布 1.0.0.0 首个正式版本：面向课堂的轻量学生积分工具，托盘常驻、多选批量加减分、小组/学生双标签页、小组与总分统计校验、多档案与按月历史，深浅主题与自定义主题色；提供 win-x64 自包含单文件包，无需安装 .NET 运行时即可使用。下载：https://github.com/XPSoftware/PointManager/releases/tag/1.0.0.0</p>\n'
              '        </li>\n'
          )
          html = html.replace(marker, marker + '\n' + entry, 1)
          p.write_text(html, encoding='utf-8')
          print('OK: announcement inserted')
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "no change to commit"
            exit 0
          fi
          git commit -m "docs: 公告栏置顶新增 PointManager 1.0.0.0 发布日志"
          git push
