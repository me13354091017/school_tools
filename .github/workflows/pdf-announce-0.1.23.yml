name: PDF announce 0.1.23

on:
  push:
    paths:
      - 'release-notes/pdf-0.1.23.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert announcement on top
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'SCHOOL_TOOLS_PDF 更新 0.1.23' in s:
              print('already announced')
              raise SystemExit(0)
          anchor = '<ul class="announcement-list">'
          block = '''<li class="announcement-item">
          <time datetime="2026-11-27">2026-11-27</time>
          <p class="announcement-content">SCHOOL_TOOLS_PDF 更新 0.1.23（激光笔与 UInk 墨迹交换）：一、新增激光笔，点浮动栏激光按钮进入，按住笔或鼠标就出红色光轨，笔停住留个光点，一秒后自动淡出，只指不写、不落墨、不进撤销、不写进 PDF，讲台上指公式不再用手指遮字；二、新增 UInk 墨迹交换格式与导入导出，浮动栏更多菜单里导出会把整份文档的批注写成 .uink 文本（JSON），换机器时导入按页还原（同页原墨迹会被替换，PDF 本身不动）；三、误迹查杀（DDB），一键扫描全文档，只清点按钮时被提升成笔事件留下的孤立小墨点，正常笔画一律不动；四、智能擦（仿 Inkeys），橡皮菜单面积擦里有开关，擦到一笔的大半直接整笔清掉，不留碎残段；五、块级懒加载，离视口两屏以外的页面挂起墨迹绘制，滚回来自动恢复，长文档更顺；六、界面更 Fluent，浮动栏与弹层圆角统一放大，主栏和更多菜单加了柔和投影。下载：安装包 / 免安装压缩包（GitHub Release v0.1.23）。</p>
          </li>'''
          if anchor not in s:
              raise SystemExit('anchor not found')
          s = s.replace(anchor, anchor + '\n        ' + block, 1)
          p.write_text(s, encoding='utf-8')
          print('inserted')
          PY
      - name: Commit and push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git commit -m "announce: SCHOOL_TOOLS_PDF 0.1.23" || exit 0
          git push
