name: PDF unannounce 0.1.27

# 临时下架工作流：撤掉母站公告栏里的 0.1.27 条目并删除对应说明文件。
on:
  push:
    paths:
      - 'release-notes/pdf-0.1.27.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unannounce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove announcement
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s2 = re.sub(r'\s*<li class="announcement-item">\s*<time datetime="2026-11-28">2026-11-28</time>\s*<p class="announcement-content">SCHOOL_TOOLS_PDF 更新 0\.1\.27.*?</p>\s*</li>', '', s, flags=re.S)
          if s2 == s:
              print('no block found')
          else:
              p.write_text(s2, encoding='utf-8')
              print('removed')
          PY
      - name: Commit and push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git rm -f release-notes/pdf-0.1.27.md || true
          git commit -m "announce: 下架 SCHOOL_TOOLS_PDF 0.1.27" || exit 0
          git push
