name: PDF announce 0.1.24

on:
  push:
    paths:
      - 'release-notes/pdf-0.1.24.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert announcement on top
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('写成 .uink 文本（JSON）', '写成 .uink 文件（MessagePack 对象流，按 UInk 1.1 规范）')
          if 'SCHOOL_TOOLS_PDF 更新 0.1.24' in s:
              print('already announced')
              p.write_text(s, encoding='utf-8')
              raise SystemExit(0)
          anchor = '<ul class="announcement-list">'
          block = '''<li class="announcement-item">
          <time datetime="2026-11-28">2026-11-28</time>
          <p class="announcement-content">SCHOOL_TOOLS_PDF 更新 0.1.24（UInk 1.1 规范墨迹交换）：导入导出按 UInk 1.1 Beta 公开规范全部重写：.uink 不再是自编 JSON，而是规范要求的 MessagePack 对象流——开头 Header（版本 11、设备数、工作区数、页数、时间），接着设备与工作区登记，每页一个 Canvas（页 GUID、页码、图层号、白色背景 、视口），每笔一个 Ink 块（颜色、透明度、纹理、逐点坐标与宽度，荧光笔按 1:8 矩形笔尖写入），压感烘焙进每点宽度，首点绝对坐标、之后相对位移；导出时整份文档每页都写 Canvas，空白页也写，在别的软件里打开页码连续；读取端按规范容错：同页 GUID 后出现者整体替代、认不出的块跳过、Clear 块清空该页、尾部不完整丢弃最后一个对象、中间损坏保留已读部分。本版声明写入基础级、读取标准级，可与智绘教 Inkeys、ICC-CE 直接互导。其余功能同 0.1.23。下载：安装包 / 免安装压缩包（GitHub Release v0.1.24）。</p>
          </li>'''
          if anchor not in s:
              raise SystemExit('anchor not found')
          s = s.replace(anchor, anchor + '\n        ' + block, 1)
          p.write_text(s, encoding='utf-8')
          print('inserted')
          PY
      - name: Commit and push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git rm -f .github/workflows/pdf-announce-0.1.24.yml || true
          git commit -m "announce: SCHOOL_TOOLS_PDF 0.1.24" || exit 0
          git push
