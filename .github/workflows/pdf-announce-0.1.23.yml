name: PDF announce 0.1.25

on:
  push:
    paths:
      - 'release-notes/pdf-0.1.25.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert announcement on top
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'SCHOOL_TOOLS_PDF 更新 0.1.25' in s:
              print('already announced')
              raise SystemExit(0)
          anchor = '<ul class="announcement-list">'
          block = '''<li class="announcement-item">
          <time datetime="2026-11-28">2026-11-28</time>
          <p class="announcement-content">SCHOOL_TOOLS_PDF 更新 0.1.25（滚动与打开性能）：一、滚动和惯性滚动期间，页面与缩略图位图改走线性重采样，停下 260 毫秒才恢复高质量——整页位图动辄三四千像素宽，每帧高质量重采样是长文档掉帧的主因；二、滚出缓冲区的页面，排队中的渲染直接作废，不再白渲染整张约 20MB 的位图并占着并发名额，快速翻页时可见页出图更快；三、页面渲染并发按 CPU 核数自适应（2 到 3 路）；四、打开文档时，取页尺寸与读墨迹库并行执行，几百页课件加大墨迹库能省上百毫秒，所有页尺寸收进一次锁内算完；五、启动时线程池最小线程数抬到核数以上，取尺寸、读库、渲染首屏不再排队等线程。功能与 0.1.24 一致。下载：安装包 / 免安装压缩包（GitHub Release v0.1.25）。</p>
          </li>'''
          if anchor not in s:
              raise SystemExit('anchor not found')
          s = s.replace(anchor, anchor + '\n        ' + block, 1)
          p.write_text(s, encoding='utf-8')
          print('inserted')
          PY
      - name: Commit and push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git commit -m "announce: SCHOOL_TOOLS_PDF 0.1.25" || exit 0
          git push
