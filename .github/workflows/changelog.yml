name: Changelog Entry

on:
  push:
    paths:
      - '.github/workflows/changelog.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Insert top changelog entry
        run: |
          python3 - << 'PY'
          from pathlib import Path

          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          guard = 'SchoolToolsBoard（STB）课堂白板发布 v1.1.4'
          if guard in html:
              print('SKIP: entry already present')
              raise SystemExit(0)

          marker = '<ul class="announcement-list">'
          if html.count(marker) != 1:
              raise SystemExit('marker count unexpected: %d' % html.count(marker))

          entry = (
              '        <li class="announcement-item">\n'
              '            <time datetime="2026-11-16">2026-11-16</time>\n'
              '            <p class="announcement-content">'
              + guard
              + '：新增与希沃同形态的板中板（白底黑笔、居中于主白板、可拖可拉伸、多页+撤销，关闭即把板书按原位置贴回主白板且可 Ctrl+Z 撤销）；同时把笔迹平滑、工具栏动效、窗口背景、PPT 预览加载动画的默认值调到更省资源的平衡档。'
              '            </p>\n'
              '        </li>\n'
          )

          html = html.replace(marker, marker + '\n' + entry, 1)
          p.write_text(html, encoding='utf-8')
          print('OK: entry inserted')
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "no change to commit"
            exit 0
          fi
          git commit -m "docs: 公告栏置顶新增 SchoolToolsBoard v1.1.4（板中板 + 性能默认值）记录"
          git push
