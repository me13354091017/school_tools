name: PDF announce 0.1.22

on:
  push:
    paths:
      - 'release-notes/pdf-0.1.22.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert announcement on top
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'SCHOOL_TOOLS_PDF 更新 0.1.22' in s:
              print('already announced')
              raise SystemExit(0)
          anchor = '<ul class="announcement-list">'
          block = '''<li class="announcement-item">
          <time datetime="2026-11-27">2026-11-27</time>
          <p class="announcement-content">SCHOOL_TOOLS_PDF 更新 0.1.22（调色盘重做与吸管取色）：硬笔与软笔共用一套 11 色板，删掉原来的亮/暗系按钮，两套里几乎相同的颜色合并，并新增紫与灰；最后一个色块是自定义色，点开色轮就能选任意颜色；新增吸管取色，点一下进入取色模式，在页面任意位置实时预览屏幕颜色，左键确认即可写入画笔——考题涂改、取页面底色盖字都方便；粗细新增细 1、中 5、粗 12 三档按钮，下方有墨迹预览曲线，颜色与粗细即时跟随；墨迹栏加了拖动把手，按住可拖到任意位置并记住，设置页的右、下边距滑块同步生效。其余功能与 0.1.21 一致。下载：安装包 / 免安装压缩包（GitHub Release v0.1.22）。</p>
          </li>'''
          if anchor not in s:
              raise SystemExit('anchor not found')
          s = s.replace(anchor, anchor + '\n        ' + block, 1)
          p.write_text(s, encoding='utf-8')
          print('inserted')
          PY
      - name: Commit and push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git commit -m "announce: SCHOOL_TOOLS_PDF 0.1.22" || exit 0
          git push
