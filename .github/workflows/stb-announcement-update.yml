name: stb-announcement-update
on:
  push:
    paths:
      - '.github/stb-announcement-trigger.txt'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update announcement
        run: python3 .github/update_announcement.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && echo 'no changes' || git commit -m 'docs: 更新 STB 1.0.3.5 公告'
          git push
