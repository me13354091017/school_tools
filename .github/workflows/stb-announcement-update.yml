name: STB announcement update

on:
  push:
    paths:
      - '.github/stb-announcement-trigger.txt'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert announcement
        run: python3 .github/update_announcement.py
      - name: Commit announcement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then echo 'no changes'; exit 0; fi
          git commit -m '母站公告：STB 1.0.3.4 函数图标尺寸与描边'
          git push
