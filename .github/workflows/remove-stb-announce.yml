name: Remove STB Announcements
on:
  push:
    paths:
      - '.github/workflows/remove-stb-announce.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Remove STB announcement items
        run: |
          python3 - << 'PY'
          import re
          from pathlib import Path
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          KW = ('SchoolToolsBoard', 'STB', 'SCHOOL_TOOLS_BOARD')
          pat = re.compile(r'<li class="announcement-item">.*?</li>', re.S)
          removed = 0
          def repl(m):
              global removed
              block = m.group(0)
              if any(k in block for k in KW):
                  removed += 1
                  return ''
              return block
          html = pat.sub(repl, html)
          p.write_text(html, encoding='utf-8')
          print('OK: removed %d STB announcement(s)' % removed)
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "no change to commit"
            exit 0
          fi
          git commit -m "docs: 删除公告栏全部 SCHOOL_TOOLS_BOARD（STB）发布记录"
          git push
