name: Add All App Icons
on:
  push:
    paths:
      - '.github/workflows/add-all-icons.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch dedicated icons for every app
        id: fetch
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - << 'PY'
          import json, os, re, sys, time, traceback, urllib.request, pathlib

          TOKEN = os.environ.get('GH_TOKEN', '')
          API = 'https://api.github.com'
          OUT = pathlib.Path('assets/icons')
          OUT.mkdir(parents=True, exist_ok=True)
          REPORT = OUT / '_report.json'
          state = {'processed': 0, 'repo_icon': 0, 'avatar': 0, 'fail': 0, 'errors': []}

          def dump():
              REPORT.write_text(json.dumps(state, ensure_ascii=False, indent=2), encoding='utf-8')

          def get(url, raw=False):
              h = {'User-Agent': 'icon-bot', 'Accept': 'application/vnd.github+json'}
              if TOKEN:
                  h['Authorization'] = 'Bearer ' + TOKEN
              req = urllib.request.Request(url, headers=h)
              with urllib.request.urlopen(req, timeout=30) as resp:
                  data = resp.read()
              return data if raw else json.loads(data)

          def main():
              html_path = pathlib.Path('index.html')
              html = html_path.read_text(encoding='utf-8')
              pairs = re.findall(r'<div class="tool-name">([^<]+)</div>.*?<a class="project-btn" href="([^"]+)"', html, re.S)

              def repo_of(u):
                  m = re.search(r'github\.com/([^/]+)/([^/?#]+)', u)
                  return (m.group(1), m.group(2).rstrip('.')) if m else None

              existing = set(k.lower() for k in re.findall(r'"(\w[\w.-]*/[\w.-]+)":\s*"assets/icons/', html))
              targets, seen = [], set()
              for name, url in pairs:
                  rv = repo_of(url)
                  if not rv:
                      continue
                  key = (rv[0] + '/' + rv[1]).lower()
                  if key in seen or key in existing:
                      continue
                  seen.add(key)
                  targets.append((rv[0], rv[1]))

              ICON = re.compile(r'([^/]*(?:icon|logo|favicon|avatar|brand|app)[^/]*)\.(png|svg|ico|webp|jpg|jpeg|gif)$', re.I)
              BAD = re.compile(r'(node_modules|/tests?/|sample|screenshot|preview|banner|cover|background|readme|license|\.github/)', re.I)
              STEM = {'icon': 0, 'favicon': 1, 'logo': 2, 'app': 3, 'avatar': 4, 'brand': 5}
              EXT = {'png': 0, 'svg': 1, 'webp': 2, 'ico': 3, 'jpg': 5, 'jpeg': 6, 'gif': 9}

              def pick(paths):
                  best = None
                  for p in paths:
                      if not ICON.search(p) or BAD.search(p):
                          continue
                      stem = re.sub(r'[^a-z]', '', pathlib.Path(p).stem.lower())
                      ext = pathlib.Path(p).suffix.lower().lstrip('.')
                      score = (STEM.get(stem, 9), EXT.get(ext, 9), p.count('/'), len(p))
                      if best is None or score < best[0]:
                          best = (score, p)
                  return best[1] if best else None

              def safe(s):
                  return re.sub(r'[^a-z0-9_.-]', '-', s.lower())

              mapping = []
              for owner, repo in targets:
                  state['processed'] += 1
                  saved = None
                  try:
                      meta = get(f'{API}/repos/{owner}/{repo}')
                      full = meta['full_name']
                      branch = meta.get('default_branch') or 'main'
                      tree = get(f"{API}/repos/{owner}/{repo}/git/trees/{branch}?recursive=1")
                      paths = [t['path'] for t in tree.get('tree', []) if t.get('type') == 'blob']
                      path = pick(paths)
                      if path:
                          raw = get('https://raw.githubusercontent.com/' + full + '/' + branch + '/' + path, raw=True)
                          if 800 < len(raw) < 600000:
                              ext = pathlib.Path(path).suffix.lower().lstrip('.')
                              fn = safe(full.replace('/', '__')) + '.' + ext
                              (OUT / fn).write_bytes(raw)
                              saved = (fn, 'repo_icon')
                  except Exception as e:
                      state['errors'].append(f'{owner}/{repo}: {type(e).__name__} {e}'[:160])

                  if not saved:
                      try:
                          raw = get(f'https://github.com/{owner}.png?size=128', raw=True)
                          fn = 'owner__' + safe(owner) + '.png'
                          (OUT / fn).write_bytes(raw)
                          saved = (fn, 'avatar')
                      except Exception as e:
                          state['errors'].append(f'{owner} avatar: {type(e).__name__} {e}'[:160])

                  if saved:
                      mapping.append((f'{owner}/{repo}'.lower(), 'assets/icons/' + saved[0]))
                      state[saved[1]] += 1
                  else:
                      state['fail'] += 1
                  if state['processed'] % 10 == 0:
                      dump()

              extra = [('MiniClassIsland', 'miniclassisland'), ('ICE 冰核智能教务', 'intelligent-class-ecosystem')]
              for name, org in extra:
                  try:
                      raw = get(f'https://github.com/{org}.png?size=128', raw=True)
                      fn = 'owner__' + safe(org) + '.png'
                      (OUT / fn).write_bytes(raw)
                      marker = '<div class="tool-name">' + name + '</div>'
                      i = html.find(marker)
                      if i > 0:
                          j = html.rfind('<div class="tool-card">', 0, i)
                          if j > 0:
                              html = html[:j] + f'<div class="tool-card" data-icon-url="assets/icons/{fn}">' + html[j + len('<div class="tool-card">'):]
                              state['avatar'] += 1
                  except Exception as e:
                      state['errors'].append(f'extra {name}: {type(e).__name__} {e}'[:160])

              anchor = '    const repositoryIcons = {\n'
              if anchor in html and mapping:
                  lines = ''.join(f'        "{k}": "{v}",\n' for k, v in mapping)
                  html = html.replace(anchor, anchor + lines, 1)
              html_path.write_text(html, encoding='utf-8')
              state['mapped'] = len(mapping)
              dump()
              print(json.dumps(state, ensure_ascii=False)[:3000])

          try:
              main()
          except Exception:
              state['fatal'] = traceback.format_exc()[-3000:]
              dump()
              print(state['fatal'])
              sys.exit(1)
          PY
      - name: Commit and push
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/icons
          if git diff --cached --quiet; then
            echo "no change to commit"
            exit 0
          fi
          git commit -m "feat: 为全部应用添加专属图标"
          git push
