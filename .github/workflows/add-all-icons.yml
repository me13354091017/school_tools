name: Add All App Icons
on:
  push:
    paths:
      - '.github/workflows/add-all-icons.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch dedicated icons for every app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - << 'PY'
          import json, os, re, time, urllib.request, urllib.error, pathlib

          TOKEN = os.environ.get('GH_TOKEN', '')
          API = 'https://api.github.com'

          def get(url, raw=False):
              h = {'User-Agent': 'icon-bot', 'Accept': 'application/vnd.github+json'}
              if TOKEN:
                  h['Authorization'] = 'Bearer ' + TOKEN
              req = urllib.request.Request(url, headers=h)
              with urllib.request.urlopen(req, timeout=30) as resp:
                  data = resp.read()
              return data if raw else json.loads(data)

          html = pathlib.Path('index.html').read_text(encoding='utf-8')
          pairs = re.findall(r'<div class="tool-name">([^<]+)</div>.*?<a class="project-btn" href="([^"]+)"', html, re.S)

          def repo_of(u):
              m = re.search(r'github\.com/([^/]+)/([^/?#]+)', u)
              return (m.group(1), m.group(2).rstrip('.')) if m else None

          existing = set(k.lower() for k in re.findall(r'"(\w[\w.-]*/[\w.-]+)":\s*"assets/icons/', html))

          targets, seen = [], set()
          for name, url in pairs:
              rv = repo_of(url)
              if not rv:
                  continue
              key = (rv[0] + '/' + rv[1]).lower()
              if key in seen or key in existing:
                  continue
              seen.add(key)
              targets.append((name, rv[0], rv[1]))

          ICON = re.compile(r'([^/]*(?:icon|logo|favicon|avatar|brand|app)[^/]*)\.(png|svg|ico|webp|jpg|jpeg|gif)$', re.I)
          BAD = re.compile(r'(node_modules|/tests?/|sample|screenshot|preview|banner|cover|background|readme|license|\.github/)', re.I)
          STEM = {'icon': 0, 'favicon': 1, 'logo': 2, 'app': 3, 'avatar': 4, 'brand': 5}
          EXT = {'png': 0, 'svg': 1, 'webp': 2, 'ico': 3, 'jpg': 5, 'jpeg': 6, 'gif': 9}

          def pick(paths):
              best = None
              for p in paths:
                  if not ICON.search(p) or BAD.search(p):
                      continue
                  stem = re.sub(r'[^a-z]', '', pathlib.Path(p).stem.lower())
                  ext = pathlib.Path(p).suffix.lower().lstrip('.')
                  score = (STEM.get(stem, 9), EXT.get(ext, 9), p.count('/'), len(p))
                  if best is None or score < best[0]:
                      best = (score, p)
              return best[1] if best else None

          def safe(s):
              return re.sub(r'[^a-z0-9_.-]', '-', s.lower())

          out = pathlib.Path('assets/icons')
          out.mkdir(parents=True, exist_ok=True)
          mapping, stats = [], {'repo_icon': 0, 'avatar': 0, 'letter': 0, 'fail': 0}

          for name, owner, repo in targets:
              saved = None
              try:
                  meta = get(f'{API}/repos/{owner}/{repo}')
                  full = meta['full_name']
                  branch = meta.get('default_branch', 'main')
                  tree = get(f"{API}/repos/{owner}/{repo}/git/trees/{branch}?recursive=1")
                  paths = [t['path'] for t in tree.get('tree', []) if t.get('type') == 'blob']
                  path = pick(paths)
                  if path:
                      data = get('https://raw.githubusercontent.com/' + full + '/' + branch + '/' + path, raw=True)
                      if len(data) > 800 and len(data) < 600000:
                          ext = pathlib.Path(path).suffix.lower().lstrip('.')
                          fn = safe(full.replace('/', '__')) + '.' + ext
                          (out / fn).write_bytes(data)
                          saved = (fn, 'repo_icon')
              except Exception as e:
                  print('probe failed', owner, repo, type(e).__name__)

              if not saved:
                  try:
                      data = get(f'https://github.com/{owner}.png?size=128', raw=True)
                      if data[:4] == b'\x89PNG' or len(data) > 1000:
                          ext = 'png'
                          fn = 'owner__' + safe(owner) + '.png'
                          (out / fn).write_bytes(data)
                          saved = (fn, 'avatar')
                  except Exception:
                      pass

              if saved:
                  mapping.append((f'{owner}/{repo}'.lower(), 'assets/icons/' + saved[0]))
                  stats[saved[1]] += 1
              else:
                  stats['fail'] += 1
                  print('no icon for', owner, repo)
              time.sleep(0.05)

          # 两个无具体仓库的卡片：用组织头像 + data-icon-url
          extra = [
              ('MiniClassIsland', 'miniclassisland'),
              ('ICE 冰核智能教务', 'intelligent-class-ecosystem'),
          ]
          for name, org in extra:
              try:
                  data = get(f'https://github.com/{org}.png?size=128', raw=True)
                  fn = 'owner__' + safe(org) + '.png'
                  (out / fn).write_bytes(data)
                  marker = '<div class="tool-name">' + name + '</div>'
                  i = html.find(marker)
                  if i > 0:
                      j = html.rfind('<div class="tool-card">', 0, i)
                      if j > 0:
                          html = html[:j] + f'<div class="tool-card" data-icon-url="assets/icons/{fn}">' + html[j + len('<div class="tool-card">'):]
                          stats['avatar'] += 1
              except Exception as e:
                  print('extra failed', name, type(e).__name__)

          anchor = '    const repositoryIcons = {\n'
          lines = ''.join(f'        "{k}": "{v}",\n' for k, v in mapping)
          if anchor in html:
              html = html.replace(anchor, anchor + lines, 1)

          pathlib.Path('index.html').write_text(html, encoding='utf-8')

          report = {'processed': len(targets), **stats, 'mapped_written': len(mapping)}
          pathlib.Path('assets/icons/_report.json').write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
          print(report)
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/icons
          if git diff --cached --quiet; then
            echo "no change to commit"
            exit 0
          fi
          git commit -m "feat: 为全部应用添加专属图标"
          git push
