name: STB announce 1.0.3.0

on:
  push:
    paths:
      - '.github/workflows/stb-announce-1.0.3.0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert announcement on top
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if '1.0.3.0' in s:
              print('already announced')
              raise SystemExit(0)
          anchor = '<ul class="announcement-list">'
          block = '''<li class="announcement-item">
            <time datetime="2026-11-26">2026-11-26</time>
            <p class="announcement-content">SchoolToolsBoard（STB）更新 1.0.3.0「统一线性图标 + 书写平滑」：按新版参考图重做全应用图标——书写（铅笔 + 波浪线）、板中板 / 黑板（装订板 + 铅笔）、更新（双箭头循环）、颜色主题（半明半暗圆）、设置（滑杆）、高级（代码窗口 + 扳手）、组件（方块 + 菱形）、关于（圆圈 i），浮动栏、左侧竖栏、笑脸菜单与设置页导航同步替换，图标跟随 12 套主题色；书写开启 FitToCurve 与子像素渲染，落笔后做 0.2 / 0.6 / 0.2 三点加权平滑，减少低价触控框的折线感。保留 1.0.2.7 的浮窗拖动修复。下载：安装包 / 免安装桌面版（GitHub Release v1.0.3.0）。</p>
            </li>'''
          new = anchor + '\n        ' + block
          if anchor not in s:
              raise SystemExit('anchor not found')
          s = s.replace(anchor, new, 1)
          p.write_text(s, encoding='utf-8')
          print('inserted')
          PY
      - name: Commit and push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git commit -m "announce: STB 1.0.3.0" || exit 0
          git push
