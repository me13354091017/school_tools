name: Add Owner App Icons 2
on:
  push:
    paths:
      - '.github/workflows/add-owner-icons.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download owner app icons
        run: |
          mkdir -p assets/icons
          curl -fL --retry 3 -m 60 "https://raw.githubusercontent.com/me13354091017/SCHOOL_TOOLS_BOARD/main/icons/icon.svg" -o assets/icons/me13354091017__school_tools_board.svg
          curl -fL --retry 3 -m 60 "https://raw.githubusercontent.com/me13354091017/SCHOOL_TOOLS_PDF/main/SCHOOL_PDF/Resources/app.ico" -o assets/icons/me13354091017__school_tools_pdf.ico
          ls -l assets/icons/me13354091017__school_tools_board.svg assets/icons/me13354091017__school_tools_pdf.ico
      - name: Patch index.html icon mapping
        run: |
          python3 - << 'PY'
          from pathlib import Path
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          if 'me13354091017/school_tools_board' in html:
              print('SKIP: mapping already present')
              raise SystemExit(0)
          anchor = '    const repositoryIcons = {\n'
          add = (
              '        "me13354091017/school_tools_pdf": "assets/icons/me13354091017__school_tools_pdf.ico",\n'
              '        "me13354091017/school_tools_board": "assets/icons/me13354091017__school_tools_board.svg",\n'
          )
          if html.count(anchor) != 1:
              raise SystemExit('anchor count unexpected: %d' % html.count(anchor))
          html = html.replace(anchor, anchor + add, 1)
          p.write_text(html, encoding='utf-8')
          print('OK: mapping inserted')
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/icons/
          if git diff --cached --quiet; then
            echo "no change to commit"
            exit 0
          fi
          git commit -m "feat: 为 SCHOOL_TOOLS 旗下应用（PDF、SchoolToolsBoard）添加专属图标"
          git push
