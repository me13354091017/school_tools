name: PDF announce 0.1.21

on:
  push:
    paths:
      - 'release-notes/pdf-0.1.21.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert announcement on top
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'SCHOOL_TOOLS_PDF 更新 0.1.21' in s:
              print('already announced')
              raise SystemExit(0)
          anchor = '<ul class="announcement-list">'
          block = '''<li class="announcement-item">
          <time datetime="2026-11-25">2026-11-25</time>
          <p class="announcement-content">SCHOOL_TOOLS_PDF 更新 0.1.21（浮动栏点按不再出墨点）：点击墨迹浮动栏上的按钮时，页面原来会在原地冒出一个墨点，现已修复——落点在浮动栏范围内的整笔触摸或笔迹不再被页面画布收下，抬笔时整笔丢弃；即使有漏网笔画，只要所有点都落在浮动栏矩形内也会被立刻移除。其余功能与 0.1.20 一致。下载：安装包 / 免安装压缩包（GitHub Release v0.1.21）。</p>
          </li>'''
          if anchor not in s:
              raise SystemExit('anchor not found')
          s = s.replace(anchor, anchor + '\n        ' + block, 1)
          p.write_text(s, encoding='utf-8')
          print('inserted')
          PY
      - name: Commit and push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git commit -m "announce: SCHOOL_TOOLS_PDF 0.1.21" || exit 0
          git push
