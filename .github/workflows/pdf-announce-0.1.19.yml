name: PDF announce 0.1.19

on:
  push:
    paths:
      - 'release-notes/pdf-0.1.19.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert announcement on top
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'SCHOOL_TOOLS_PDF 更新 0.1.19' in s:
              print('already announced')
              raise SystemExit(0)
          anchor = '<ul class="announcement-list">'
          block = '''<li class="announcement-item">
          <time datetime="2026-11-24">2026-11-24</time>
          <p class="announcement-content">SCHOOL_TOOLS_PDF 更新 0.1.19（命中修复与区间调整）：修复浮动栏点击穿透——笔尖或手指点在按钮间隙、圆角，或点墨迹/橡皮/图形菜单外的空白时，笔迹不再落到下面的页面；打开文档的加载遮罩期间浮动栏也不再拦截点击。笔粗细区间改为 0.5~20（步进 0.5），硬笔、软笔、荧光笔与设置页默认值统一；墨迹保存清晰度倍率改为 1~4 倍（默认仍 4 倍），低倍率可明显减小保存后的 PDF 体积。下载：安装包 / 免安装压缩包（GitHub Release v0.1.19）。</p>
          </li>'''
          if anchor not in s:
              raise SystemExit('anchor not found')
          s = s.replace(anchor, anchor + '\n        ' + block, 1)
          p.write_text(s, encoding='utf-8')
          print('inserted')
          PY
      - name: Commit and push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git commit -m "announce: SCHOOL_TOOLS_PDF 0.1.19" || exit 0
          git push
